<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="千机匣：纯前端开发者工作台。二维码生成与解码、JSON 工作台、JWT 解析、Base64、哈希、时间戳、Cron 解析、正则测试等，智能识别粘贴内容，所有数据仅在浏览器本地处理。">
<meta name="keywords" content="在线工具,二维码生成,二维码解码,JSON格式化,JWT解析,Base64,时间戳,Cron,正则,开发者工具">
<meta name="theme-color" content="#0b0d12">
<title>千机匣 · 纯前端开发者工作台</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="css/style.css">
<script>try{var t=localStorage.getItem('tb:theme');if(t)document.documentElement.setAttribute('data-theme',JSON.parse(t));}catch(e){}</script>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="#/">
      <img src="favicon.svg" alt="" width="30" height="30">
      <span><b>千机匣</b><small>Toolbox</small></span>
    </a>
    <button class="search-trigger" id="openPalette" type="button">
      <span>搜索工具…</span><kbd>Ctrl K</kbd>
    </button>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">
      <span>纯前端 · 数据不出浏览器</span>
      <a href="https://github.com/buhuiphp/online-tools" target="_blank" rel="noopener">GitHub</a>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="菜单">&#9776;</button>
      <div class="crumb" id="crumb"></div>
      <div class="top-actions">
        <button class="icon-btn" id="paletteBtn" type="button" title="搜索 (Ctrl K)">&#8981;</button>
        <button class="icon-btn" id="themeBtn" type="button" title="切换主题">&#9680;</button>
      </div>
    </header>
    <main id="view" class="view"></main>
  </div>
</div>

<div class="palette hidden" id="palette">
  <div class="palette-box">
    <input id="paletteInput" type="text" placeholder="输入工具名称、拼音首字母或关键词…" autocomplete="off">
    <ul id="paletteList"></ul>
    <div class="palette-foot"><span><kbd>↑</kbd><kbd>↓</kbd> 选择</span><span><kbd>Enter</kbd> 打开</span><span><kbd>Esc</kbd> 关闭</span></div>
  </div>
</div>
<div class="popover hidden" id="sendMenu"></div>
<div id="toast" class="toast"></div>

<script src="js/core.js"></script>
<script src="js/detect.js"></script>
<script src="js/tools/qr.js"></script>
<script src="js/tools/codec.js"></script>
<script src="js/tools/data.js"></script>
<script src="js/tools/text.js"></script>
<script src="js/tools/dev.js"></script>
<script src="js/tools/image.js"></script>
<script src="js/app.js"></script>
</body>
</html>
