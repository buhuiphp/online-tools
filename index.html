<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="纯前端在线工具集：文本处理、编码转换、JSON格式化、正则测试、二维码生成与解码、条形码、时间戳、UUID、密码生成、图片压缩等，所有数据仅在浏览器本地处理。">
<meta name="keywords" content="在线工具,二维码生成,二维码解码,JSON格式化,Base64,时间戳转换,UUID,正则表达式,图片压缩">
<title>在线工具集 - 纯前端实用工具大全</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
  <header class="header">
    <h1><a href="#/">在线工具集</a></h1>
    <p>纯前端实现 · 数据只在你的浏览器中处理 · 免费无广告</p>
    <p class="tool-count" id="toolCount"></p>
  </header>

  <main id="home">
    <div class="search-bar">
      <span class="search-icon">&#x1F50D;</span>
      <input id="search" type="text" placeholder="搜索工具，如：二维码、JSON、时间戳…" autocomplete="off">
      <button class="clear-btn" id="clearSearch" title="清除">&times;</button>
    </div>
    <nav class="group-nav" id="groupNav"></nav>
    <div id="groups"></div>
    <div class="no-result" id="noResult">没有找到相关工具</div>
  </main>

  <section id="toolView" class="tool-view hidden">
    <div class="tool-topbar">
      <a href="#/" class="back">&larr; 返回首页</a>
      <h2 id="toolTitle"></h2>
      <span id="toolDesc" class="tool-sub"></span>
    </div>
    <div id="toolBody" class="panel"></div>
  </section>

  <footer class="footer">
    <p>&copy; <span id="year"></span> 在线工具集 · 纯静态页面，托管于 GitHub Pages · <a href="https://github.com/buhuiphp/online-tools" target="_blank" rel="noopener">GitHub</a></p>
  </footer>
</div>
<div id="toast" class="toast"></div>

<script src="js/core.js"></script>
<script src="js/tools/text.js"></script>
<script src="js/tools/encode.js"></script>
<script src="js/tools/code.js"></script>
<script src="js/tools/qrcode.js"></script>
<script src="js/tools/dev.js"></script>
<script src="js/tools/network.js"></script>
<script src="js/app.js"></script>
</body>
</html>
